[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Dust to Glory
Description=Open-world life, driving and superhero sandbox.
ProjectVersion=0.1.0

[/Script/UnrealEd.ProjectPackagingSettings]
; Game data (vehicles, careers, powers, furniture...) ships as plain JSON next to the build.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Data")
; Every mesh in the game is generated at runtime and drawn with the engine's vertex-colour material,
; loaded by path. No map or asset references it, so without this the cooker leaves it out and a packaged
; build renders the whole world with the default material. The editor hides this: it has everything.
+DirectoriesToAlwaysCook=(Path="/Engine/EngineMaterials")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineDebugMaterials")
; The front end and the HUD draw with the engine's own fonts, which are likewise referenced by nothing.
+DirectoriesToAlwaysCook=(Path="/Engine/EngineFonts")
BuildConfiguration=PPBC_Shipping
