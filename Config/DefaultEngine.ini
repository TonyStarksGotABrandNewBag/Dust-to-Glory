[/Script/EngineSettings.GameMapsSettings]
; The city is generated in code at runtime, so the game boots into the engine's empty Entry map.
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/DustToGlory.DTGGameMode

[/Script/Engine.RendererSettings]
; Fully dynamic lighting: Lumen GI + reflections, virtual shadow maps, TSR.
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AntiAliasingMethod=4
r.Nanite.ProjectEnabled=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.SkinCache.CompileShaders=True
r.Substrate=False
; Hardware ray tracing: Lumen traces real geometry on an RTX card instead of distance fields, and lights
; reflections at the hit point, which is most of what makes glass towers, car paint and wet roads read
; as real. Nanite meshes go into the ray tracing scene at full detail rather than as their fallbacks.
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=1
; Ray tracing sees Nanite's coarse fallback meshes, not the full geometry: with twenty City Sample cars of
; a million triangles each, building the full-detail structures on the first frame tripped the driver's
; two-second watchdog with the card at 6.7 of its 7.1 GB.
r.RayTracing.Nanite.Mode=0
; Memory, measured with -DTGMemReport on an 8 GB card (docs/REALISM.md): virtual shadow map pages and the
; Lumen surface cache were 650 and 620 MB at default sizes; half of each is not visible from the street.
r.Shadow.Virtual.MaxPhysicalPages=2048
; Ray-tracing geometry: the resident pool is 400 MB by default and the scene asked for 402 (static
; BLASes 398 MB: the procedural terrain, roads and buildings, which nothing streams out), so the engine
; warned "requested memory over budget" and evicted every frame. 768 fits the 1.4 GB the card had free.
r.RayTracing.ResidentGeometryMemoryPoolSizeInMB=768
r.LumenScene.SurfaceCache.AtlasSize=2048
r.Streaming.LimitPoolSizeToVRAM=1
r.VirtualTextures=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; Shader Model 6 is what Nanite and virtual shadow maps need. The engine's base config targets only SM5,
; and without this line the game ran on SM5 on an RTX 5070 -- Nanite silently off, every Nanite mesh
; drawn as its coarse fallback (tree leaves collapsed to triangles). SM5 stays as the fallback for
; older GPUs; the engine uses the highest the hardware supports.
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/MacTargetPlatform.MacTargetSettings]
; Apple Silicon Macs use Metal SM6; software Lumen keeps the look without hardware ray tracing.
+TargetedRHIs=SF_METAL_SM6

[/Script/Engine.CollisionProfile]
; Car bodies need a sweep that passes through the ground their own wheels ride on, while still hitting
; walls, parked cars and people. Visibility cannot do it: the engine's Pawn profile ignores Visibility,
; so a sweep on that channel drives straight through pedestrians. This channel blocks by default, which
; means everything stops a car unless it says otherwise -- and the terrain says otherwise.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="DTGBodySweep")

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000

[SystemSettings]
; NVIDIA DLSS 4.5 (Tools/fetch_dlss.py; optional, so these do nothing without it and TSR upscales instead).
; Quality mode renders at two thirds resolution and reconstructs the rest; Ray Reconstruction (DenoiserMode 1)
; replaces the ray-traced lighting denoisers with NVIDIA's, which is cleaner on reflections and in motion; frame
; generation runs in auto mode, on only where it helps.
r.NGX.DLSS.Enable=1
r.NGX.DLSS.DenoiserMode=1
r.ScreenPercentage=66.7
r.Streamline.DLSSG.Enable=2

