[/Script/EngineSettings.GameMapsSettings]
; The city is generated in code at runtime, so the game boots into the engine's empty Entry map.
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/DustToGlory.DTGGameMode

[/Script/Engine.RendererSettings]
; Fully dynamic lighting: Lumen GI + reflections, virtual shadow maps, TSR.
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AntiAliasingMethod=4
r.Nanite.ProjectEnabled=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.SkinCache.CompileShaders=True
r.Substrate=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/MacTargetPlatform.MacTargetSettings]
; Apple Silicon Macs use Metal SM6; software Lumen keeps the look without hardware ray tracing.
+TargetedRHIs=SF_METAL_SM6

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000
