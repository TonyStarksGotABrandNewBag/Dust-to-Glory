# The game's content is plain JSON loaded at runtime, so a typo in it is a broken build to us.
# This checks every data file parses before the core tests get a chance to load them.
name: Content

on:
  push:
    branches: [main]
  pull_request:

jobs:
  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every data file
        run: python3 Tests/check_content.py
      # A building service the interface does not recognise is a menu row that does nothing. Nothing
      # else catches it: it compiles, it draws, and it tells the player the name of what it did not do.
      - name: Every building service reaches the simulation
        run: python3 Tests/check_services.py
      # The engine layer cannot be compiled anywhere in CI -- Unreal is not here -- so the one class
      # of error a script can still catch is a simulation name used unqualified in an engine header,
      # where the using-directive in the .cpp has not reached yet.
      - name: Engine headers qualify simulation names
        run: python3 Tests/check_headers.py
